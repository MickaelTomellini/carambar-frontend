<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carambar Blagues - Découvrez et ajoutez des blagues aléatoires !">
  <title>Carambar Blagues</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 min-h-screen flex flex-col font-sans text-white">

  <!-- Header -->
  <header class="bg-gray-900 text-white font-bold py-10 shadow-inner border-b-2 border-yellow-400 rounded-b-3xl text-center text-lg md:text-xl drop-shadow-lg">
    <h1 class="text-4xl md:text-5xl lg:text-5xl font-extrabold uppercase text-white">
      Caramblagues
    </h1>
    <p class="text-xs md:text-sm text-pink-500 font-extrabold uppercase drop-shadow-sm mt-2">
      Création de blagues
    </p>
  </header>

  <main class="flex-1 w-full px-4 md:px-0">

    <!-- Section Random Blague -->
    <section id="randomBlague"
      class="mx-auto my-12 p-8 md:p-10 max-w-xl bg-gray-900 border-4 border-pink-600 text-white rounded-3xl shadow-2xl text-center font-semibold text-lg md:text-2xl transition-transform duration-300 hover:scale-105 hover:shadow-[0_0_50px_rgba(236,72,153,0.7)]">
      Génère une blague aléatoire
    </section>

    <!-- Bouton Random -->
    <div class="text-center mb-16">
      <button id="randomBtn"
        class="px-10 py-5 md:px-16 md:py-6 bg-gradient-to-r from-pink-600 to-pink-800 text-white rounded-3xl shadow-lg hover:from-pink-700 hover:to-black hover:shadow-[0_0_40px_rgba(236,72,153,0.8)] transition-all duration-300 font-extrabold text-lg md:text-2xl">
        BLAGUE ALÉATOIRE
      </button>
    </div>

    <!-- Section Ajouter une Blague -->
    <section
      class="p-8 md:p-10 bg-gray-900 rounded-3xl shadow-2xl max-w-xl mx-auto mb-16 hover:shadow-[0_0_60px_rgba(236,72,153,0.6)] transition-shadow duration-500">
      <h2 class="text-3xl md:text-4xl font-extrabold mb-6 text-pink-500 text-center tracking-wider drop-shadow-md">
        AJOUTE UNE BLAGUE
      </h2>

      <textarea id="texteInput" placeholder="Ta Blague ici"
        class="border-2 border-yellow-400 p-5 w-full mb-5 rounded-2xl focus:ring-2 focus:ring-pink-600 resize-none h-36 bg-gray-800 text-white font-medium placeholder-pink-400 transition-all duration-300 shadow-inner hover:shadow-[inset_0_0_15px_rgba(236,72,153,0.5)]">
      </textarea>

      <textarea id="reponseInput" placeholder="Réponse de ta blague ici"
        class="border-2 border-yellow-400 p-5 w-full mb-5 rounded-2xl focus:ring-2 focus:ring-pink-600 resize-none h-36 bg-gray-800 text-white font-medium placeholder-pink-400 transition-all duration-300 shadow-inner hover:shadow-[inset_0_0_15px_rgba(236,72,153,0.5)]">
      </textarea>

      <button id="addBtn"
        class="px-14 py-5 md:px-16 md:py-6 bg-pink-600 text-white rounded-2xl w-full font-extrabold hover:bg-pink-700 hover:shadow-[0_0_50px_rgba(236,72,153,0.8)] transition-all duration-300 text-lg md:text-2xl">
        AJOUTER
      </button>
    </section>

    <!-- Liste des Blagues -->
    <section id="blagues" class="flex flex-wrap justify-center gap-8 px-4 md:px-0 mb-16">
      <!-- Les blagues ajoutées via JS apparaîtront ici -->
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 border-t-2 border-pink-500 text-white font-bold py-10 shadow-inner rounded-t-3xl text-center text-lg md:text-xl drop-shadow-lg">
    2026 CARAMBAR © Tous droits réservés.
  </footer>

  <script src="script.js" defer></script>
</body>

</html>
